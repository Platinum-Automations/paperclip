
name: Platinum - Build Paperclip Docker

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: platinum-paperclip-build
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish Paperclip
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          df -h
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/share/swift \
            /usr/local/lib/android \
            /opt/ghc
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Paperclip
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/platinum-automations/paperclip:sha-${{ github.sha }}
          build-args: |
            PAPERCLIP_BUILD_COMMIT=${{ github.sha }}

      - name: Display published image and immutable digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # AzureBuild-MCPAgent pins Paperclip by digest (PAPERCLIP_IMAGE in deploy/release.env).
          ref="ghcr.io/platinum-automations/paperclip@${DIGEST}"
          echo "Tag:    ghcr.io/platinum-automations/paperclip:sha-${GITHUB_SHA}"
          echo "Digest: ${ref}"
          {
            echo "### Paperclip image"
            echo "- Tag: \`ghcr.io/platinum-automations/paperclip:sha-${GITHUB_SHA}\`"
            echo "- Pin in AzureBuild-MCPAgent \`deploy/release.env\`:"
            echo ""
            echo "\`\`\`"
            echo "PAPERCLIP_IMAGE=${ref}"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$ref" > image-digest.txt

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: paperclip-image-digest
          path: image-digest.txt
